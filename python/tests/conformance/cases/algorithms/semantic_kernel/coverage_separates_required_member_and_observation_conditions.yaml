id: coverage_separates_required_member_and_observation_conditions
description: Coverage assigns required-member and observation predicates to their own row domains.
kind: algorithm
algorithm: semantic.question_contract
input:
  question_context_texts: ["Which workers completed a task in every active category during March 2026?"]
  frame_payload:
    decision_basis: The result is the workers whose March task observations cover every active category.
    outcome:
      kind: question_meaning
      answer_requests:
        - result_kind: qualifying_instances
          qualifying_row_kind: {meaning: workers, origin: {kind: question}}
          grouping_meanings: []
          returned_candidate_identity: {meaning: qualifying workers, origin: {kind: question}}
          return_request_basis: Return the qualifying worker identities.
          returned_result: {kind: identities}
          answer_values: []
          returned_value_refs: []
          ordering_value_refs: []
          selection: {kind: all_results}
          universal_shape: every_required_member_has_observation
      supplied_values:
        - meaning: the observation period
          denotation_basis: March 2026 is a period applied to task observations.
          non_entity_value:
            value: {operands: [March 2026], value_type: {kind: temporal_scope}, origin: {kind: question}}
  payload:
    decision_basis: The result is the workers whose March task observations cover every active category.
    outcome:
      kind: question_contract
      answer_requests:
        - requested_fact_ref: fact_1
          origin: {source: question_context, meaning: workers covering every active category, resolved_input_ref: null}
          other_sets:
            - {id: s2, origin: &observation_origin {source: question_context, meaning: task observations, resolved_input_ref: null}}
            - {id: s3, origin: &category_origin {source: question_context, meaning: categories, resolved_input_ref: null}}
          other_associations:
            - {id: a1, from_set_ref: s1, to_set_ref: s2, origin: {source: question_context, meaning: worker task observation, resolved_input_ref: null}}
            - {id: a2, from_set_ref: s3, to_set_ref: s2, origin: {source: question_context, meaning: observation category, resolved_input_ref: null}}
          candidate_set: {instance_interpretation: normal_business_instance}
          qualification:
            kind: coverage
            required_member_set_ref: s3
            required_member_condition: {kind: fact, observed_for_ref: s3, value_type: {kind: boolean}, origin: {source: question_context, meaning: category is active, resolved_input_ref: null}}
            observation_set_ref: s2
            observation_condition: {kind: within, value: {kind: fact, observed_for_ref: s2, value_type: {kind: date}, origin: {source: question_context, meaning: task date, resolved_input_ref: null}}, scope: {kind: input_ref, input_ref: i1}}
          grouping: []
          ordering: []
          selection: null
          distinct_by: []
          outputs:
            - {expression: {kind: set_ref, set_ref: s1}}
expect:
  result_contains:
    requested_facts:
      - id: fact_1
        result_grain: subject_rows
        population_atoms: ["fact_1:expression:e2"]
        scoped_boolean_requirements:
          - {atom: "fact_1:fact:f1", use_site: coverage_required_member, owner_expression_ref: "fact_1:expression:e2"}
          - {atom: "fact_1:expression:e1", use_site: coverage_condition, owner_expression_ref: "fact_1:expression:e2"}
