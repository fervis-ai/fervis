id: retained_read_preserves_row_grain_alternatives
description: Field relevance does not silently select a row grain before explicit source realization.
kind: algorithm
algorithm: semantic.kernel
input:
  mode: retained_read_row_sources
  sources:
    - id: sales
      read_id: list_sales
      row_path_id: sales
      row_path: data
      field_refs: [sale_id, sold_at]
    - id: sale_items
      read_id: list_sales
      row_path_id: sale_items
      row_path: data.items
      field_refs: [sale_id, sold_at, sale_item_id]
  retained_field_tokens: [sold_at]
expect:
  result_contains:
    retained_source_refs: [sales, sale_items]
    retained_source_count: 2
