id: collection_input_is_one_typed_operand
description: Separately supplied alternatives form one collection operand, one qualification use, and one grouping domain.
kind: algorithm
algorithm: semantic.question_contract
input:
  question_context_texts: ["How many observations belong to member A or member B? Return one count per member."]
  frame_payload:
    decision_basis: The result counts qualifying observations once for each supplied member alternative.
    outcome:
      kind: question_meaning
      answer_requests:
        - result_kind: grouped_results
          qualifying_row_kind: {meaning: observations, origin: {kind: question}}
          grouping_meanings:
            - {meaning: member identity, origin: {kind: question}, grouping_kind: related_entity_identity}
          return_request_basis: Return each member identity and observation count.
          returned_result: {kind: identities_and_values}
          answer_values:
            - {value_ref: v1, meaning: observation count, origin: {kind: question}}
          returned_value_refs: [v1]
          ordering_value_refs: []
          selection: {kind: all_results}
          universal_shape: none
      supplied_values:
        - meaning: the alternative members included in the result
          denotation_basis: Each supplied member name refers to one particular member.
          entity_reference:
            instance_kind: member
            value:
              operands: [member A, member B]
              origin: {kind: question}
  payload:
    decision_basis: The result counts qualifying observations once for each supplied member alternative.
    outcome:
      kind: question_contract
      answer_requests:
        - requested_fact_ref: fact_1
          origin: {source: question_context, meaning: observation count per supplied member, resolved_input_ref: null}
          other_sets: []
          other_associations: []
          candidate_set: {instance_interpretation: normal_business_instance}
          qualification:
            kind: input_comparison
            input: {kind: input_ref, input_ref: i1}
            operator: in
            fact: &member_identity
              kind: fact
              observed_for_ref: a1
              value_type: {kind: identifier, set_ref: s2}
              origin: {source: question_context, meaning: member identity, resolved_input_ref: null}
          grouping:
            - id: g1
              grouping_basis: Each observation is grouped by the exact member instance related to it.
              kind: related_instance_identity
              identified_set: {id: s2}
              association: {id: a1, origin: {source: question_context, meaning: observations belonging to members, resolved_input_ref: null}}
          ordering: []
          selection: null
          distinct_by: []
          outputs:
            - {expression: {kind: group_ref, ref: g1}}
            - {expression: {kind: aggregate, function: count, argument: {kind: set_ref, set_ref: s1}, distinct_argument: false}}
expect:
  result_contains:
    input_refs: [i1]
    inputs:
      - {input_ref: i1, operand: [member A, member B], value_kind: collection}
    requested_facts:
      - id: fact_1
        result_grain: groups
        grouping_refs: ["fact_1:fact:f1"]
        input_use_refs: [i1]
        input_uses:
          - {input_ref: i1, operand_meaning: the alternative members included in the result}
        identity_input_refs: [i1]
        population_atoms: ["fact_1:expression:e1"]
