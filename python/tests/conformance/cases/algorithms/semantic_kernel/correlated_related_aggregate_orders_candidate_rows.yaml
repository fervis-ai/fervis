id: correlated_related_aggregate_orders_candidate_rows
description: Explicitly distinct candidate rows can be ordered by an unreturned related-row aggregate.
kind: algorithm
algorithm: semantic.question_contract
input:
  question_context_texts:
  - Which distinct staff have been paid the most this month?
  frame_payload:
    decision_basis: The result returns staff candidates ranked by their related paid amounts this month.
    outcome:
      kind: question_meaning
      answer_requests:
      - return_request_basis: Return the staff with the greatest paid amount.
        relational_shape_basis: The requested relational shape is ordinary.
        request:
          relational_shape: ordinary
          result_grain_basis: The requested result grain is one_result_per_qualifying_row.
          result:
            kind: one_result_per_qualifying_row
            result_candidates:
              instance_kind: staff
              origin:
                kind: question
            projection:
              projection_basis: Return the qualifying candidate identity.
              candidate_identity: returned
              explicitly_requested_values: []
            result_order:
              ordering_request_basis: The declared ordering values determine result order.
              ordering:
                kind: ordered_by
                values:
                - ownership_basis: Paid amount orders staff but is absent from the returned meanings.
                  kind: unreturned_ordering_meaning
                  meaning: amount paid this month
                  origin:
                    kind: question
              selection:
                kind: first_rank_with_ties
      supplied_values:
        selection_limits: []
        operands:
        - meaning: this month
          denotation_basis: The current month bounds the related payment rows.
          non_entity_value:
            kind: temporal_scope
            value:
              operands:
              - this month
              origin:
                kind: question
      question_input_inventory_check:
        all_input_like_phrases_declared: true
  payload:
    decision_basis: Staff candidates are ordered by the sum of their related payments in the supplied month.
    outcome:
      kind: question_contract
      answer_requests:
      - requested_fact_ref: fact_1
        origin:
          source: question_context
          meaning: staff paid the most this month
          resolved_input_ref: null
        candidate_set:
          instance_kind: staff
          instance_interpretation: resource_population
        set_graph:
          identity_input_relations: {}
          requested_output_relations: {}
          other_related_sets:
          - association:
              id: a1
              origin:
                source: question_context
                meaning: staff has payment occurrences
                resolved_input_ref: null
            set:
              id: s2
              instance_kind: payment occurrences
              origin:
                source: question_context
                meaning: payment occurrences
                resolved_input_ref: null
            related_sets: []
        qualification: null
        grouping: []
        ordering:
        - ordering_basis: Compare staff by the sum of related paid amounts.
          expression:
            kind: filtered_aggregate
            function: sum
            argument:
              kind: fact
              observed_for_ref: s2
              origin:
                source: question_context
                meaning: paid amount
                resolved_input_ref: null
            filter:
              kind: within
              value:
                kind: fact
                observed_for_ref: s2
                origin:
                  source: question_context
                  meaning: payment date
                  resolved_input_ref: null
              scope:
                kind: input_ref
                input_ref: i1
            distinct_argument: false
          direction: descending
        selection:
          kind: first_rank_with_ties
        distinct_by:
        - kind: set_ref
          set_ref: s1
        outputs:
          result_key_outputs:
          - expression:
              kind: set_ref
              set_ref: s1
          requested_value_outputs: []
expect:
  result_contains:
    input_refs:
    - i1
    requested_facts:
    - id: fact_1
      result_grain: subject_rows
      ordering_meanings:
      - amount paid this month
      input_use_refs:
      - i1
      output_refs:
      - fact_1:output:output_1
