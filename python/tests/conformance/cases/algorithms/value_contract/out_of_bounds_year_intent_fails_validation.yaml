id: out_of_bounds_year_intent_fails_validation
description: Time intent validation rejects year values outside the supported calendar range.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: period, unit: year, mode: full, named: {value: 10000}}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
