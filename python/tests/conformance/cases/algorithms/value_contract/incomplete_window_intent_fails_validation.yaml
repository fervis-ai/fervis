id: incomplete_window_intent_fails_validation
description: Time intent validation rejects a zero-length relative window.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: window, unit: day, count: 0, direction: past}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
