id: out_of_bounds_weekday_intent_fails_validation
description: Time intent validation rejects weekday values outside the calendar range.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: point, precision: day, named: {weekday: 9}}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
