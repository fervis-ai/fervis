id: out_of_bounds_month_intent_fails_validation
description: Time intent validation rejects month values outside the calendar range.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: period, unit: month, mode: full, named: {value: 13}}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
