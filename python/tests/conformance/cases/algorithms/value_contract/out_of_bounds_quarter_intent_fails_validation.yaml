id: out_of_bounds_quarter_intent_fails_validation
description: Time intent validation rejects quarter values outside the calendar range.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: period, unit: quarter, mode: full, named: {value: 5}}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
