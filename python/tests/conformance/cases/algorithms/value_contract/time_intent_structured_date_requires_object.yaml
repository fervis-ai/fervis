id: time_intent_structured_date_requires_object
description: Time intent validation rejects date components that are not structured objects.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: since Jan 13th
  anchor_date: "2026-07-10"
  intent: {kind: open_range, start: "2026-01-13"}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
