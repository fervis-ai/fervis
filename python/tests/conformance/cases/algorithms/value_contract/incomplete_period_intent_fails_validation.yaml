id: incomplete_period_intent_fails_validation
description: Time intent validation rejects a period missing its concrete period value.
kind: algorithm
algorithm: business_time.resolve
input:
  expression: time
  anchor_date: "2026-01-01"
  intent: {kind: period, unit: month, mode: full}
expect:
  result_contains: {status: rejected, code: invalid_time_intent}
