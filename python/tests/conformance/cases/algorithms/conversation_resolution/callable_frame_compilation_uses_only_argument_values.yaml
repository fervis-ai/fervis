id: callable_frame_compilation_uses_only_argument_values
description: A callable frame compiles from its declared argument values without treating other resolution work as invocation input.
kind: algorithm
algorithm: conversation_resolution.compile
input:
  current_question: What about Pivot Mall?
  context_sources:
    - source_id: prior_question
      kind: prior_user_question
      text: How many sales did we make at Acacia Mall today?
      source_card_ids: [prior_card]
      source_memory_ids: [prior_request]
  context_frames:
    - frame_id: request:1
      source_ids: [prior_question]
      parts:
        - {part_id: subject, kind: subject, text: sales}
        - {part_id: output:1, kind: requested_output, text: number of sales}
        - {part_id: input:location, kind: input, text: Acacia Mall, value_type: identity}
        - {part_id: input:time, kind: input, text: today, value_type: time}
      callable:
        base_invocation_id: pi_base
        program_id: ap_base
        requested_fact_ref: fact_1
        requested_fact_fingerprint: fingerprint_1
        parameters:
          - parameter_id: value.location
            part_id: input:location
            value_type: identity
            input_ref: location
            input_use_refs: [fact_1:input_use:location]
            current_text: Acacia Mall
          - parameter_id: value.time
            part_id: input:time
            value_type: time
            input_ref: time
            input_use_refs: [fact_1:input_use:time]
            current_text: today
  payload:
    kind: conversation_resolution
    current_question_text: What about Pivot Mall?
    outcome:
      kind: resolved
      resolution_basis: Current meaning and retained prior meaning form the resolved question.
      clauses:
        - current_clause_text: What about Pivot Mall?
          occurrence: 1
          request_shape_basis: The prior frame supplies the omitted sales subject and requested count.
          request_shape_source: prior_frame_supplies_omitted_request_parts
          resolved_text: How many sales did we make at Pivot Mall today?
          retained_frame_parts:
            - {kind: frame_part, frame_id: request:1, part_id: subject}
            - {kind: frame_part, frame_id: request:1, part_id: output:1}
          values:
            - value_id: pivot_mall
              resolved_text: Pivot Mall
              frame_parameter: {kind: parameter, frame_id: request:1, parameter_id: value.location}
              sources:
                - {kind: current_span, text: Pivot Mall, occurrence: 1}
            - value_id: retained_time
              resolved_text: today
              frame_parameter: {kind: parameter, frame_id: request:1, parameter_id: value.time}
              sources:
                - {kind: frame_part, frame_id: request:1, part_id: input:time}
expect:
  result_contains:
    current_question_text: What about Pivot Mall?
    recorded_contextualized_question: How many sales did we make at Pivot Mall today?
    frame_call:
      kind: call
      frame_id: request:1
    uses_prior_context: true
