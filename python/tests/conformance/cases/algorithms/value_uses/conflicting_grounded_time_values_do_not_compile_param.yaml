id: conflicting_grounded_time_values_do_not_compile_param
description: Two different values used as conjunctive constraints on one parameter fail closed.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: start_date
      type: date
      projection: TEMPORAL_START
      values:
        - {id: jan_1, kind: time, expression: January 1, resolved_start: "2030-01-01", resolved_end: "2030-01-01", granularity: day}
        - {id: jan_2, kind: time, expression: January 2, resolved_start: "2030-01-02", resolved_end: "2030-01-02", granularity: day}
expect:
  result_contains: {status: rejected}
