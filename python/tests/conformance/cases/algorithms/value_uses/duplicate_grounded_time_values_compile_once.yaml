id: duplicate_grounded_time_values_compile_once
description: Equivalent resolved values for one parameter compile once and retain both proofs.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: start_date
      type: date
      projection: TEMPORAL_START
      values:
        - {id: first_use, kind: time, expression: January 1, resolved_start: "2030-01-01", resolved_end: "2030-01-01", granularity: day, proof_refs: [use:first]}
        - {id: second_use, kind: time, expression: January 1, resolved_start: "2030-01-01", resolved_end: "2030-01-01", granularity: day, proof_refs: [use:second]}
expect:
  result_contains:
    binding_sets:
      - start_date: {value: "2030-01-01", proof_refs: [use:first, use:second]}
