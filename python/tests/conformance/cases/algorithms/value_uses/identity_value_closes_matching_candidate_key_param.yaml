id: identity_value_closes_matching_candidate_key_param
description: A canonical identity projects its declared key component into a typed endpoint parameter.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: resource_id
      type: uuid
      projection: IDENTITY_COMPONENT
      component_id: resource_id
      values:
        - {id: resolved_resource, kind: identity, entity_kind: resource, key_id: primary_key, key_component_id: resource_id, value: 51515151-0000-0000-0002-000000000001, proof_refs: [resolver:resource_detail]}
expect:
  result_contains:
    binding_sets:
      - resource_id: {value: 51515151-0000-0000-0002-000000000001, proof_refs: [resolver:resource_detail]}
