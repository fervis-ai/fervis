id: duplicate_endpoint_arg_merges_proof_refs
description: Equivalent endpoint constraints compile once while retaining every supporting proof.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: area
      type: string
      projection: WHOLE_VALUE
      values:
        - {id: first_use, kind: named, text: area-1, proof_refs: [binding:first]}
        - {id: second_use, kind: named, text: area-1, proof_refs: [binding:second]}
expect:
  result_contains:
    binding_sets:
      - area: {value: area-1, proof_refs: [binding:first, binding:second]}
