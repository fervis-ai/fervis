id: time_components_compile_to_endpoint_params
description: One resolved time value projects its start and end into distinct typed endpoint parameters.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: start_date
      type: date
      projection: TEMPORAL_START
      values:
        - {id: period, kind: time, expression: March 2026, resolved_start: "2026-03-01", resolved_end: "2026-03-31", granularity: month, proof_refs: [input:period]}
    - target_id: end_date
      type: date
      projection: TEMPORAL_END
      values:
        - {id: period, kind: time, expression: March 2026, resolved_start: "2026-03-01", resolved_end: "2026-03-31", granularity: month, proof_refs: [input:period]}
expect:
  result_contains:
    binding_sets:
      - start_date: {value: "2026-03-01", proof_refs: [input:period]}
        end_date: {value: "2026-03-31", proof_refs: [input:period]}
