id: grounded_choice_value_compiles_to_choice_param
description: A typed scalar accepted by a declared choice parameter remains the selected wire value.
kind: algorithm
algorithm: source_binding.parameter_alternatives
input:
  projected_parameter_constraints:
    - target_id: state
      type: choice
      choices: [OPEN, CLOSED]
      projection: WHOLE_VALUE
      values:
        - {id: state_value, kind: string, value: CLOSED}
expect:
  result_contains:
    binding_sets:
      - state: {value: CLOSED}
