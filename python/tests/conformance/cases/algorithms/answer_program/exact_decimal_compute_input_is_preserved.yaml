id: exact_decimal_compute_input_is_preserved
description: Exact decimal operands reach deterministic computation without binary-float rounding.
kind: algorithm
algorithm: execution.relation_engine
input:
  relations: []
  operations:
    - id: scaled
      output_relation: ""
      spec:
        kind: compute
        expression:
          operator: multiply
          left:
            value: {input_ref: amount, value: "1.234567890123456789012345"}
          right:
            value: {input_ref: rate, value: "0.1"}
        output_scalar: scaled
expect:
  result_contains:
    scalar_text:
      scaled: "0.1234567890123456789012345"
