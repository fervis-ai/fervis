id: string_set_filter_is_case_sensitive
description: Membership filtering over declared strings uses exact case-sensitive equality.
kind: algorithm
algorithm: execution.relation_engine
input:
  scalar_inputs:
    - {id: allowed, value: [COMPLETED], value_type: string_collection}
  relations:
    - id: records
      rows:
        - {id: exact, state: COMPLETED}
        - {id: different_case, state: completed}
      grain_keys: [id]
      field_types: {id: string, state: string}
  operations:
    - id: selected
      output_relation: result
      spec:
        kind: filter
        input_relation: records
        condition: {left: state, operator: in, right_scalar: allowed}
expect:
  result_contains:
    result:
      rows:
        - {id: exact, state: COMPLETED}
