id: source_read_failures_cannot_produce_answers
kind: algorithm
algorithm: answer_program.invoke
description: Failed or malformed source reads fail closed before an answer is produced.
input:
  schema_revision: 1
  program: {$ref: ../../../fixtures/answer_program_v1.yaml#/programs/invocation}
  catalog: {$ref: ../../../fixtures/answer_program_v1.yaml#/catalogs/sales}
  environment: {$ref: ../../../fixtures/answer_program_v1.yaml#/environments/invocation}
  invocations:
    - id: non_success_status
      bindings: &bindings
        - parameter_id: question.store_ids
          value:
            kind: identity_set
            entity_kind: store
            key_id: primary_key
            key_component_id: store_id
            values: [00000000-0000-0000-0001-000000000001]
            known_input_id: store_ids
            applies_to_requested_fact_ids: [fact_1]
          provenance: {kind: question_input}
        - parameter_id: semantic.sale_states
          value: {kind: string_set, values: [COMPLETED]}
          provenance: {kind: semantic_choice}
      evidence:
        - request:
            endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
          response: {status: 403, body: {detail: forbidden}}
    - id: missing_row_path
      bindings: *bindings
      evidence:
        - request:
            endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
          response: {status: 200, body: {items: []}}
    - id: non_object_row
      bindings: *bindings
      evidence:
        - request:
            endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
          response: {status: 200, body: {results: [not-an-object]}}
    - id: missing_declared_field
      bindings: *bindings
      evidence:
        - request:
            endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
          response: {status: 200, body: {results: [{store_id: 00000000-0000-0000-0001-000000000001}]}}
    - id: wrong_row_cardinality
      bindings: *bindings
      evidence:
        - request:
            endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
          response:
            status: 200
            body: {results: {sale_id: 00000000-0000-0000-0002-000000000001, store_id: 00000000-0000-0000-0001-000000000001}}
expect:
  result_contains:
    invocations:
      - id: non_success_status
        status: rejected
        requests:
          - endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
      - id: missing_row_path
        status: rejected
        requests:
          - endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
      - id: non_object_row
        status: rejected
        requests:
          - endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
      - id: missing_declared_field
        status: rejected
        requests:
          - endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
      - id: wrong_row_cardinality
        status: rejected
        requests:
          - endpoint_name: list_sale_list
            args: {sales.query.store_id: 00000000-0000-0000-0001-000000000001}
