id: later_exact_resource_name_beats_earlier_expansion
description: An exact declared resource name wins even when an earlier name on the same read is only a broader or narrower match.
kind: algorithm
algorithm: catalog_selection.select
input:
  catalog:
    reads:
      - id: sale_list
        endpoint_name: list_sale_list
        resource_names: [sale, sale list item, sales]
      - id: sale_detail
        endpoint_name: get_sale_detail
        resource_names: [sale, sales]
        params:
          - {ref: get_sale_detail.path.sale_id, name: sale_id, source: path, type: uuid, required: true}
  requested_facts:
    - id: fact_1
      description: sales
      answer_outputs:
        - {id: output_1, role: ANSWER_VALUE}
  resource_name_matches:
    - requested_fact_id: fact_1
      answer_output_resource_lineage:
        - answer_output_id: output_1
          support_role: MEASURED_VALUE
          source_text: sales
          matching_resource_names: [sales]
  max_reads_per_fact: 1
expect:
  result_contains:
    requested_fact_selections:
      - requested_fact_id: fact_1
        selected_read_ids: [sale_list]
