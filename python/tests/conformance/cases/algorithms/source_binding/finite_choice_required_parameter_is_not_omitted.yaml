id: finite_choice_required_parameter_is_not_omitted
description: A required finite-choice parameter remains applied even when every declared value is included.
kind: algorithm
algorithm: semantic.source_binding
input:
  mode: finite_choice_parameter_omission
  required: true
  default: null
  choices: [OPEN, CLOSED]
  included_values: [OPEN, CLOSED]
expect:
  result_contains:
    parameter_omitted: false
    included_values: [OPEN, CLOSED]
