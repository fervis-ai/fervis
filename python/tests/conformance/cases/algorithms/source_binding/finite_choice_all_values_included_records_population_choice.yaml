id: finite_choice_all_values_included_records_population_choice
description: An optional finite-choice parameter is omitted when every declared value remains included.
kind: algorithm
algorithm: semantic.source_binding
input:
  mode: finite_choice_parameter_omission
  required: false
  default: null
  choices: [OPEN, CLOSED]
  included_values: [OPEN, CLOSED]
expect:
  result_contains:
    parameter_omitted: true
    included_values: [OPEN, CLOSED]
